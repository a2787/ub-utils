name: maintenance

# 本地回归矩阵的 CI 化（OB-REL-001）：只跑不访问真实站点的检查；
# 真实站点探针需要用户专用浏览器与登录态授权，永远不在 CI 里执行。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  local-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ubuntu-latest 预装 Google Chrome 稳定版；test/runtime.cjs 通过 CHROME_PATH 复用它。
      CHROME_PATH: /usr/bin/google-chrome
      OMNIBLOCK_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          # docs-check 校验“最近验证的源码快照是 HEAD 祖先”，需要完整历史。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and documentation gates
        run: |
          node --check omniblock.user.js
          node test/docs-check.cjs
          git diff --check
      - name: Local regression matrix
        # push 门禁 = 既有 22 项 + Task 4.2 差集补入的 headless 项
        # （ui-settings、dark-mode、rule-manager、rule-samples，均为人工合成夹具）
        # + Task 4.1 的 code-health 静态基线门禁。
        # degraded-storage 不进标准 runner：它需要 Edge/Chromium 持久化 profile 且
        # headless:false（test/degraded-storage.cjs:73），留给本地/发布前专用门禁，
        # 环境要求见 docs/MAINTENANCE_WORKFLOW.md 登录态探针一节。
        # 2026-11-23 本地 headless 已通过：ai-auto-gate、ai-batch、ai-bridge、
        # ai-context、ai-eval、ai-fact-integration、ai-retrieval，已加入 push。
        # gateway-smoke 需要 Docker Linux 引擎，本轮未运行，排除并记 blocked。
        run: |
          set -e
          for test in run state quickblock comment-manager danmaku-auto work-block \
            performance weibo-replay userscript-product adapters douyin sync sync-server \
            ai-screening ai-prompt-system ai-prompt-eval ai-platforms content-ai \
            content-coverage ai-autoload ai-watchdog probe-hygiene \
            ui-settings dark-mode rule-manager rule-samples ai-auto-gate ai-batch \
            ai-bridge ai-context ai-eval ai-fact-integration ai-retrieval code-health; do
            echo "=== $test ==="
            node "test/$test.cjs"
          done
      - name: Probe classification self-test
        run: node test/dedicated-browser-probe.cjs --self-test
